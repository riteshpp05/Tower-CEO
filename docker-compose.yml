version: '3.8'

services:
  cfo-frontend:
    build:
      context: ./frontend-cfo
      dockerfile: Dockerfile
    image: tower-ceo/cfo-frontend:latest
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - tower-network

  tender-frontend:
    build:
      context: ./frontend-tender
      dockerfile: Dockerfile
    image: tower-ceo/tender-frontend:latest
    ports:
      - "5174:80"
    restart: unless-stopped
    networks:
      - tower-network

  cfo-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tower-ceo/backend:latest
    env_file:
      - ./backend/.env
    command: ["python", "-m", "cfo_tower.cfo_server"]
    ports:
      - "3002:3002"
    restart: unless-stopped
    networks:
      - tower-network
    # Exposing the GPU to the container if Ollama runs locally inside or needs it
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  proxy-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tower-ceo/backend:latest
    env_file:
      - ./backend/.env
    command: ["python", "proxy.py"]
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - tower-network

networks:
  tower-network:
    driver: bridge
